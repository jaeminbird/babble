[project]
name = "faultline"
version = "0.1.0"
description = "A Claude agent harness for diagnosing network faults safely, with an eval bench to measure it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
faultline = "faultline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs Docker + containerlab or a real API key (skipped by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
