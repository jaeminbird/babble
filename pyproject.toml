[project]
name = "babble"
version = "0.1.0"
description = "A Claude agent harness for diagnosing network faults safely, with an eval bench to measure it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
babble = "babble.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs Docker + containerlab or a real API key (skipped by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose, one sentence per line. Rewrapping it would change the cached system prompt.
"src/babble/harness/prompts.py" = ["E501"]
