id: bgp-wrong-neighbor-ip
title: Core router r3 peers with the wrong address on the data center edge
topology: metro
difficulty: medium
fixable: true
alert: >
  Users at both sites cannot reach the data center server 172.16.0.10.
  The data center was reachable earlier today.
inject:
  - device: r3
    config:
      - router bgp 65000
      - no neighbor 10.100.0.2
      - neighbor 10.100.0.6 remote-as 65100
checks:
  - {kind: ping, device: ha, target: 172.16.0.10}
  - {kind: ping, device: hb, target: 172.16.0.10}
  - {kind: bgp_established, device: r3, target: 10.100.0.2}
  - {kind: bgp_established, device: rdc, target: 10.100.0.1}
root_cause: {device: r3, category: bgp_neighbor_misconfig}
