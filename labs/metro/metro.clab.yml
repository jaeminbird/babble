name: metro

topology:
  defaults:
    kind: frr
    image: quay.io/frrouting/frr:containerlab-10.7.1

  nodes:
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r1.conf
    r2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r2.conf
    r3:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r3.conf
    ra:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/ra.conf
    rb:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/rb.conf
    rdc:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/rdc.conf

    ha:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 192.168.1.1
        - ip route add 172.16.0.0/12 via 192.168.1.1
        - ip route add 192.168.0.0/16 via 192.168.1.1
    hb:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 192.168.2.1
        - ip route add 172.16.0.0/12 via 192.168.2.1
        - ip route add 192.168.0.0/16 via 192.168.2.1
    hdc:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 172.16.0.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 172.16.0.1
        - ip route add 172.16.0.0/12 via 172.16.0.1
        - ip route add 192.168.0.0/16 via 172.16.0.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r1:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "ra:eth1"]
    - endpoints: ["r2:eth3", "rb:eth1"]
    - endpoints: ["r3:eth3", "rdc:eth1"]
    - endpoints: ["ra:eth2", "ha:eth1"]
    - endpoints: ["rb:eth2", "hb:eth1"]
    - endpoints: ["rdc:eth2", "hdc:eth1"]
