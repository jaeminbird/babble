name: metro

devices:
  r1: {kind: router, role: core, asn: 65000, loopback: 10.255.0.1}
  r2: {kind: router, role: core, asn: 65000, loopback: 10.255.0.2}
  r3: {kind: router, role: core, asn: 65000, loopback: 10.255.0.3}
  ra: {kind: router, role: site A edge, asn: 65001, loopback: 10.255.0.11}
  rb: {kind: router, role: site B edge, asn: 65002, loopback: 10.255.0.12}
  rdc: {kind: router, role: data center edge, asn: 65100, loopback: 10.255.0.21}
  ha: {kind: host, role: site A host, ip: 192.168.1.10}
  hb: {kind: host, role: site B host, ip: 192.168.2.10}
  hdc: {kind: host, role: DC server, ip: 172.16.0.10}

links:
  - {a: "r1:eth1", b: "r2:eth1", subnet: "10.0.12.0/30"}
  - {a: "r2:eth2", b: "r3:eth1", subnet: "10.0.23.0/30"}
  - {a: "r1:eth2", b: "r3:eth2", subnet: "10.0.13.0/30"}
  - {a: "r1:eth3", b: "ra:eth1", subnet: "10.1.0.0/30"}
  - {a: "r2:eth3", b: "rb:eth1", subnet: "10.2.0.0/30"}
  - {a: "r3:eth3", b: "rdc:eth1", subnet: "10.100.0.0/30"}
  - {a: "ra:eth2", b: "ha:eth1", subnet: "192.168.1.0/24"}
  - {a: "rb:eth2", b: "hb:eth1", subnet: "192.168.2.0/24"}
  - {a: "rdc:eth2", b: "hdc:eth1", subnet: "172.16.0.0/24"}

health_checks:
  # Host reachability (baseline)
  - {kind: ping, device: ha, target: 172.16.0.10}
  - {kind: ping, device: hb, target: 172.16.0.10}
  - {kind: ping, device: ha, target: 192.168.2.10}
  # eBGP sessions, both ends
  - {kind: bgp_established, device: r1, target: 10.1.0.2}
  - {kind: bgp_established, device: ra, target: 10.1.0.1}
  - {kind: bgp_established, device: r2, target: 10.2.0.2}
  - {kind: bgp_established, device: rb, target: 10.2.0.1}
  - {kind: bgp_established, device: r3, target: 10.100.0.2}
  - {kind: bgp_established, device: rdc, target: 10.100.0.1}
  # iBGP full mesh on loopbacks, both ends
  - {kind: bgp_established, device: r1, target: 10.255.0.2}
  - {kind: bgp_established, device: r2, target: 10.255.0.1}
  - {kind: bgp_established, device: r1, target: 10.255.0.3}
  - {kind: bgp_established, device: r3, target: 10.255.0.1}
  - {kind: bgp_established, device: r2, target: 10.255.0.3}
  - {kind: bgp_established, device: r3, target: 10.255.0.2}
