frr defaults traditional
hostname r1
!
interface eth1
 ip address 10.0.12.1/30
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.13.1/30
 ip ospf network point-to-point
!
interface eth3
 ip address 10.1.0.1/30
!
interface lo
 ip address 10.255.0.1/32
!
router ospf
 ospf router-id 10.255.0.1
 network 10.0.12.0/30 area 0
 network 10.0.13.0/30 area 0
 network 10.255.0.1/32 area 0
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.3 remote-as 65000
 neighbor 10.255.0.3 update-source lo
 neighbor 10.1.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.255.0.2 next-hop-self
  neighbor 10.255.0.3 next-hop-self
 exit-address-family
!
