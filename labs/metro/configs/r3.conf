frr defaults traditional
hostname r3
!
interface eth1
 ip address 10.0.23.2/30
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.13.2/30
 ip ospf network point-to-point
!
interface eth3
 ip address 10.100.0.1/30
!
interface lo
 ip address 10.255.0.3/32
!
router ospf
 ospf router-id 10.255.0.3
 network 10.0.23.0/30 area 0
 network 10.0.13.0/30 area 0
 network 10.255.0.3/32 area 0
!
router bgp 65000
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 neighbor 10.100.0.2 remote-as 65100
 !
 address-family ipv4 unicast
  neighbor 10.255.0.1 next-hop-self
  neighbor 10.255.0.2 next-hop-self
 exit-address-family
!
